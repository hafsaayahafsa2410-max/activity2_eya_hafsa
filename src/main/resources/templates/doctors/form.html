<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Doctor Form</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #1565C0; }
        label { display: block; margin-top: 16px; font-weight: bold; }
        input[type=text] { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        button { margin-top: 24px; background: #1565C0; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .nav a { color: #1565C0; text-decoration: none; margin-right: 16px; }
        a { color: #1565C0; }
    </style>
</head>
<body>
    <div class="nav"><a href="/ui">Home</a><a href="/ui/doctors">Doctors</a></div>
    <h1 th:text="${doctor.id != 0} ? 'Edit Doctor' : 'New Doctor'">Doctor Form</h1>
    <form th:action="${doctor.id != 0} ? @{/ui/doctors/{id}/edit(id=${doctor.id})} : @{/ui/doctors/new}"
          th:object="${doctor}" method="post">
        <label>Name</label>
        <input type="text" th:field="*{name}" placeholder="e.g. Dr. Smith" required/>
        <label>Specialty</label>
        <input type="text" th:field="*{specialty}" placeholder="e.g. Cardiology" required/>
        <button type="submit" th:text="${doctor.id != 0} ? 'Update Doctor' : 'Save Doctor'">Save</button>
    </form>
    <br><a href="/ui/doctors">← Back to list</a>
</body>
</html>
