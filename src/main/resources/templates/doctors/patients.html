<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Doctor's Patients</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1,h2 { color: #1565C0; } h2 { font-size: 18px; margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th { background: #1565C0; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        form { display: inline; }
        button.btn-red { background: #C62828; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
        button.btn-green { background: #2E7D32; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        .nav a { color: #1565C0; text-decoration: none; margin-right: 16px; }
    </style>
</head>
<body>
    <div class="nav"><a href="/ui">Home</a><a href="/ui/doctors">Doctors</a><a href="/ui/patients">Patients</a></div>
    <h1>Patients of <span th:text="${doctor.name}"></span></h1>
    <h2>Assign a Patient</h2>
    <form th:action="@{/ui/doctors/{id}/patients/assign(id=${doctor.id})}" method="post">
        <select name="patientId" required>
            <option value="">-- Select a patient --</option>
            <option th:each="p : ${allPatients}" th:value="${p.id}" th:text="${p.name} + ' (age ' + ${p.age} + ')'"></option>
        </select>
        <button class="btn-green" type="submit">Assign</button>
    </form>
    <h2>Currently Assigned</h2>
    <table>
        <tr><th>ID</th><th>Name</th><th>Age</th><th>Action</th></tr>
        <tr th:each="p : ${assignedPatients}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.age}"></td>
            <td>
                <form th:action="@{/ui/doctors/{did}/patients/{pid}/remove(did=${doctor.id},pid=${p.id})}" method="post">
                    <button class="btn-red" type="submit">Remove</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(assignedPatients)}">
            <td colspan="4" style="text-align:center;color:#999;">No patients assigned yet.</td>
        </tr>
    </table>
</body>
</html>
