<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clinic Management</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #1565C0; }
        .cards { display: flex; gap: 20px; margin-top: 30px; }
        .card { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 24px; text-align: center; }
        .card h2 { color: #1976D2; font-size: 48px; margin: 0; }
        .card p { color: #555; margin: 8px 0 16px; }
        .card a { display: inline-block; background: #1565C0; color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Clinic Management System</h1>
    <p>Welcome! Use the links below to manage doctors and patients.</p>
    <div class="cards">
        <div class="card">
            <h2 th:text="${doctorCount}">0</h2>
            <p>Doctors in the system</p>
            <a href="/ui/doctors">Manage Doctors</a>
        </div>
        <div class="card">
            <h2 th:text="${patientCount}">0</h2>
            <p>Patients in the system</p>
            <a href="/ui/patients">Manage Patients</a>
        </div>
    </div>
</body>
</html>
